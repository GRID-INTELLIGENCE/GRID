services:
  grid-mothership:
    build: { context: ., target: dev }
    ports: ["8080:8080"]
    environment:
      MOTHERSHIP_ENVIRONMENT: development
      MOTHERSHIP_DATABASE_URL: "sqlite:///data/grid.db"
      REDIS_URL: redis://redis:6379/0
      OLLAMA_HOST: http://ollama:11434
    volumes: [./src:/app/src, grid_data:/app/data]
    depends_on: { redis: { condition: service_healthy }, ollama: { condition: service_healthy } }
    healthcheck: { test: ["CMD", "curl", "-f", "http://localhost:8080/health"], interval: 15s, timeout: 5s, retries: 3 }

  redis:
    image: redis:7-alpine
    ports: ["6379:6379"]
    volumes: [redis_data:/data]
    healthcheck: { test: ["CMD", "redis-cli", "ping"], interval: 10s, timeout: 5s, retries: 3 }

  ollama:
    image: ollama/ollama:latest
    ports: ["11434:11434"]
    volumes: [ollama_data:/root/.ollama]
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:11434/api/tags || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 15s

volumes: { grid_data: {}, redis_data: {}, ollama_data: {} }
