name: Auto-Label Failed Dependabot PRs

on:
  workflow_run:
    workflows:
      - "GRID CI"
      - "CodeQL"
      - "Dependabot Auto-Merge"
    types: [completed]

permissions:
  pull-requests: write

jobs:
  label-failed:
    name: Label failed Dependabot PRs
    if: >-
      github.event.workflow_run.conclusion == 'failure' &&
      github.event.workflow_run.event == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - name: Find associated PR
        uses: actions/github-script@v9
        with:
          script: |
            const head_sha = context.payload.workflow_run.head_sha;
            const { data: prs } = await github.rest.pulls.list({
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: 'open',
              head: `${context.repo.owner}:${context.payload.workflow_run.head_branch}`,
            });
            for (const pr of prs) {
              if (pr.user.login === 'dependabot[bot]') {
                const { data: labels } = await github.rest.issues.listLabelsOnIssue({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  issue_number: pr.number,
                });
                if (!labels.some(l => l.name === 'agent:fix')) {
                  await github.rest.issues.addLabels({
                    owner: context.repo.owner,
                    repo: context.repo.repo,
                    issue_number: pr.number,
                    labels: ['agent:fix'],
                  });
                  console.log(`Labeled PR #${pr.number} with agent:fix`);
                }
              }
            }
