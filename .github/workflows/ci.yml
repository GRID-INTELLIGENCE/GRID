name: GRID CI

on:
  push:
    branches: [main, master]
    paths-ignore:
      - "**.md"
      - "docs/**"
      - "*.txt"
      - ".gitignore"
      - "LICENSE"
  pull_request:
    branches: [main, master]
  workflow_dispatch:
    inputs:
      run_slow_tests:
        description: "Run slow/integration tests"
        required: false
        default: false
        type: boolean
      run_security_scan:
        description: "Run security scan (bandit, pip-audit)"
        required: false
        default: true
        type: boolean
      run_validation:
        description: "Run schema/contract validation"
        required: false
        default: false
        type: boolean

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}-${{ github.repository }}-grid-main
  cancel-in-progress: true

permissions:
  contents: read

env:
  UV_PYTHON: "3.13"
  PYTEST_XDIST_AUTO_NUM_WORKERS: "4"
  PYTHONUNBUFFERED: "1"
  PYTHONDONTWRITEBYTECODE: "1"
  PIP_NO_CACHE_DIR: "1"
  GRID_ENVIRONMENT: "testing"
  BLOCKER_DISABLED: "1"
  PYTHONPATH: "."
  UV_CACHE_DIR: ".cache/uv"
  MOTHERSHIP_SECRET_KEY: "ci_test_secret_key_change_me"
  MOTHERSHIP_DATABASE_URL: "sqlite:///:memory:"
  RAG_VECTOR_STORE_PROVIDER: "in_memory"
  GRID_TEST_TMPDIR: ".tmp/test"
  GRID_SANDBOX_TMPDIR: ".tmp/sandbox"

jobs:
  secrets-scan:
    name: "Secrets Scan"
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v6
      - name: "Validate version/changelog consistency"
        run: |
          python3 - <<'PY'
          import re, sys, tomllib
          from pathlib import Path
          pyproject = tomllib.loads(Path("pyproject.toml").read_text(encoding="utf-8"))
          package_version = pyproject["project"]["version"]
          changelog = Path("CHANGELOG.md").read_text(encoding="utf-8")
          match = re.search(r"^## \\[([0-9]+\\.[0-9]+\\.[0-9]+(?:[-+][0-9A-Za-z\\.-]+)?)\\]", changelog, re.MULTILINE)
          if not match:
              print("::error::Unable to find top changelog version heading in CHANGELOG.md")
              sys.exit(1)
          changelog_version = match.group(1)
          if package_version != changelog_version:
              print(f"::error::Version mismatch: pyproject.toml has {package_version}, CHANGELOG.md top entry is {changelog_version}")
              sys.exit(1)
          print(f"Version metadata aligned at {package_version}")
          PY
      - name: "Check for hardcoded secrets"
        run: |
          if grep -r -i -E "(password|secret|token|api_key)\\s*=\\s*[\\\"'][^\\\"']{20,}[\\\"']" --include="*.py" --include="*.yaml" --include="*.yml" --include="*.json" src/ 2>/dev/null; then
            echo "::error::Potential hardcoded secrets found - please review"
            exit 1
          elif grep -r -i "ghp_[a-zA-Z0-9]{36}" --include="*.py" --include="*.yaml" --include="*.yml" --include="*.json" src/ 2>/dev/null; then
            echo "::error::GitHub token found - please review"
            exit 1
          else
            echo "✅ No obvious hardcoded secrets detected"
          fi
      - name: "DEBUG gate (assert no debug in prod)"
        run: python3 scripts/assert_no_debug_in_prod.py
        continue-on-error: true

  lint:
    name: "Lint"
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: [secrets-scan]
    continue-on-error: true
    steps:
      - uses: actions/checkout@v6
      - uses: astral-sh/setup-uv@v7.3.0
        with:
          version: "0.10.4"
          python-version: "3.13"
          enable-cache: true
          cache-dependency-glob: "uv.lock"
      - run: uv python install
      - run: uv sync --frozen
      - run: uv run ruff check . --output-format=full
      - run: uv run ruff format --check src/grid/ src/application/ src/tools/ tests/
      - run: uv run mypy src/ --ignore-missing-imports || true

  security:
    name: "Security Scan (blocking)"
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: [secrets-scan]
    if: github.event.inputs.run_security_scan == 'true' || github.ref == 'refs/heads/main'
    steps:
      - uses: actions/checkout@v6
      - uses: astral-sh/setup-uv@v7.3.0
        with:
          version: "0.10.4"
          python-version: "3.13"
          enable-cache: true
          cache-dependency-glob: "uv.lock"
      - run: uv python install
      - run: uv sync --frozen
      - run: uv pip install bandit pip-audit
      - name: Run Bandit security scan
        run: uv run bandit -r src/grid src/application src/tools -ll
      - name: Run pip-audit dependency check
        run: uv run pip-audit --desc
