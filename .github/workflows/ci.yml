# =============================================================================
# GRID — Unified CI Pipeline
# =============================================================================
# Consolidated from: ci.yml, ci-main.yml, minimal-ci.yml, async-tests.yml
# Provides comprehensive quality checks, security, tests, and build verification
# =============================================================================

name: GRID CI

on:
  push:
    branches: [main, master]
    paths-ignore:
      - "**.md"
      - "docs/**"
      - "*.txt"
      - ".gitignore"
      - "LICENSE"
  pull_request:
    branches: [main, master]
  workflow_dispatch:
    inputs:
      run_slow_tests:
        description: "Run slow/integration tests"
        required: false
        default: false
        type: boolean
      run_security_scan:
        description: "Run security scan (bandit, pip-audit)"
        required: false
        default: true
        type: boolean
      run_validation:
        description: "Run schema/contract validation"
        required: false
        default: false
        type: boolean

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  UV_PYTHON: "3.13"
  PYTEST_XDIST_AUTO_NUM_WORKERS: "4"
  PYTHONUNBUFFERED: "1"
  PYTHONDONTWRITEBYTECODE: "1"
  PIP_NO_CACHE_DIR: "1"
  GRID_ENVIRONMENT: "testing"
  BLOCKER_DISABLED: "1"
  PYTHONPATH: "src"
  UV_CACHE_DIR: ".cache/uv"
  MOTHERSHIP_SECRET_KEY: "ci_test_secret_key_change_me_grid"
  MOTHERSHIP_DATABASE_URL: "sqlite:///:memory:"
  RAG_VECTOR_STORE_PROVIDER: "in_memory"
  GRID_TEST_TMPDIR: ".tmp/test"
  GRID_SANDBOX_TMPDIR: ".tmp/sandbox"

jobs:
  # =========================================================================
  # SECRETS SCAN - Quick security gate
  # =========================================================================
  secrets-scan:
    name: "Secrets Scan"
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: "Checkout"
        uses: actions/checkout@v7

      - name: "Validate version/changelog consistency"
        run: |
          python3 - <<'PY'
          import re
          import sys
          import tomllib
          from pathlib import Path

          pyproject = tomllib.loads(Path("pyproject.toml").read_text(encoding="utf-8"))
          package_version = pyproject["project"]["version"]
          changelog = Path("CHANGELOG.md").read_text(encoding="utf-8")
          match = re.search(r"^## \[([0-9]+\.[0-9]+\.[0-9]+(?:[-+][0-9A-Za-z\.-]+)?)\]", changelog, re.MULTILINE)
          if not match:
              print("::error::Unable to find top changelog version heading in CHANGELOG.md")
              sys.exit(1)
          changelog_version = match.group(1)
          if package_version != changelog_version:
              print(
                  f"::error::Version mismatch: pyproject.toml has {package_version}, "
                  f"CHANGELOG.md top entry is {changelog_version}"
              )
              sys.exit(1)
          print(f"Version metadata aligned at {package_version}")
          PY

      - name: "Check for hardcoded secrets"
        run: |
          if grep -r -i -E "(password|secret|token|api_key)\s*=\s*[\"'][^\"']{20,}[\"']" --include="*.py" --include="*.yaml" --include="*.yml" --include="*.json" src/ 2>/dev/null; then
            echo "::error::Potential hardcoded secrets found - please review"
            exit 1
          elif grep -r -i "ghp_[a-zA-Z0-9]{36}" --include="*.py" --include="*.yaml" --include="*.yml" --include="*.json" src/ 2>/dev/null; then
            echo "::error::GitHub token found - please review"
            exit 1
          else
            echo "✅ No obvious hardcoded secrets detected"
          fi

      - name: "Git hygiene (no untracked in src/ or tests/)"
        run: |
          UNTRACKED=$(git status --porcelain | awk '/^\?\?/ { print $2 }' | grep -E '^(src/|tests/)' || true)
          if [ -n "$UNTRACKED" ]; then
            echo "::error::Untracked files in src/ or tests/ - add to .gitignore or commit:"
            echo "$UNTRACKED"
            exit 1
          fi
          echo "✅ No untracked files in src/ or tests/"

      - name: "Assert no DEBUG in production (Phase 4 gate)"
        run: |
          GRID_ENV=production python3 scripts/assert_no_debug_in_prod.py
        env:
          GRID_ENV: production

  # =========================================================================
  # LINT - Code Quality Checks (non-blocking until codebase clean)
  # =========================================================================
  lint:
    name: "Lint"
    continue-on-error: true
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: [secrets-scan]
    steps:
      - name: "Checkout"
        uses: actions/checkout@v7

      - name: "Install uv"
        uses: astral-sh/setup-uv@v8.3.2
        with:
          version: "0.10.4"
          python-version: "3.13"
          enable-cache: true
          cache-dependency-glob: "uv.lock"

      - name: "Install Python"
        run: uv python install

      - name: "Sync dependencies"
        run: uv sync --frozen

      - name: "Run ruff check"
        run: uv run ruff check . --output-format=full

      - name: "Run ruff format check"
        # Match Makefile "ruff format ." scope so CI and local are consistent
        run: uv run ruff format --check .

      - name: "Run mypy"
        run: uv run mypy src/grid/ src/application/ src/tools/ src/search/ src/cognitive/ src/mycelium/ --ignore-missing-imports || true

  # =========================================================================
  # SECURITY - Security Scanning (Python + NPM)
  # =========================================================================
  security:
    name: "Security Scan"
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: [secrets-scan]
    steps:
      - name: "Checkout"
        uses: actions/checkout@v7

      - name: "Install uv"
        uses: astral-sh/setup-uv@v8.3.2
        with:
          version: "0.10.4"
          python-version: "3.13"
          enable-cache: true
          cache-dependency-glob: "uv.lock"

      - name: "Sync Python dependencies"
        run: uv sync --frozen

      - name: "Setup Node.js"
        uses: actions/setup-node@v6
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: "frontend/package-lock.json"

      - name: "Install security tools"
        run: uv pip install bandit pip-audit

      - name: "Run Bandit code security scan"
        run: uv run bandit -r src/grid src/application src/tools -ll -f json -o bandit-report.json || true

      - name: "Run pip-audit Python dependency check"
        run: |
          (uv run pip-audit --desc -f json > pip-audit-report.json) || (echo '[]' > pip-audit-report.json)
          # Fail on critical/high vulnerabilities
          if grep -q '"severity": "critical"\|"severity": "high"' pip-audit-report.json; then
            echo "::error::Critical or high severity Python vulnerabilities found"
            cat pip-audit-report.json | python3 -c "import sys,json; data=json.load(sys.stdin); [print(f'  - {v[\"name\"]}@{v[\"version\"]}: {v[\"fix\"]}') for v in data if v.get('severity') in ['CRITICAL','HIGH']]"
            exit 1
          fi

      - name: "Install frontend dependencies"
        working-directory: frontend
        run: npm ci --ignore-scripts

      - name: "Run npm audit NPM dependency check"
        id: npm-audit
        continue-on-error: true
        run: |
          cd frontend
          npm audit --json > npm-audit-report.json 2>/dev/null || true
          # Report findings but don't fail (most are dev dependencies)
          if jq -e '.metadata.vulnerabilities | (.critical > 0 or .high > 0)' npm-audit-report.json >/dev/null 2>&1; then
            echo "::warning::Critical or high severity NPM vulnerabilities found (review needed)"
            jq -r '.vulnerabilities[] | select(.severity == "critical" or .severity == "high") | "  - \(.name): \(.title)"' npm-audit-report.json
            echo "NPM_VULNS_FOUND=true" >> $GITHUB_OUTPUT
          else
            echo "NPM_VULNS_FOUND=false" >> $GITHUB_OUTPUT
          fi

      - name: "Generate security summary"
        if: always()
        run: |
          echo "## Security Scan Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### Python Dependencies (pip-audit)" >> $GITHUB_STEP_SUMMARY
          if [ -f pip-audit-report.json ]; then
            python3 -c "import json; p='pip-audit-report.json'; raw=open(p, encoding='utf-8').read().strip() or '[]'; data=json.loads(raw); print(f'  - {len(data)} vulnerabilities detected')" >> $GITHUB_STEP_SUMMARY
          else
            echo "  - No vulnerabilities detected" >> $GITHUB_STEP_SUMMARY
          fi
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### NPM Dependencies (npm audit)" >> $GITHUB_STEP_SUMMARY
          if [ -f frontend/npm-audit-report.json ]; then
            vulns=$(jq -r '.metadata.vulnerabilities | "  - Critical: \(.critical), High: \(.high), Moderate: \(.moderate), Low: \(.low)"' frontend/npm-audit-report.json)
            echo "$vulns" >> $GITHUB_STEP_SUMMARY
            if [ "${{ steps.npm-audit.outputs.NPM_VULNS_FOUND }}" == "true" ]; then
              echo "  - ⚠️ **Note**: Most NPM vulnerabilities are in dev dependencies (minimatch, tar, rollup) or research code (axios). Review and update at convenience." >> $GITHUB_STEP_SUMMARY
            fi
          else
            echo "  - No vulnerabilities detected" >> $GITHUB_STEP_SUMMARY
          fi
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### Code Security (Bandit)" >> $GITHUB_STEP_SUMMARY
          if [ -f bandit-report.json ]; then
            python3 -c "import json; data=json.load(open('bandit-report.json')); print(f'  - Errors: {data[\"errors\"]}, Issues: {len(data.get(\"results\", []))}')" >> $GITHUB_STEP_SUMMARY
          else
            echo "  - No issues detected" >> $GITHUB_STEP_SUMMARY
          fi

  # =========================================================================
  # SMOKE TEST - Quick Environment Verification
  # =========================================================================
  smoke-test:
    name: "Smoke Test"
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: [secrets-scan]
    env:
      UV_TORCH_BACKEND: "cpu" # Use CPU-only torch to avoid 2GB CUDA download
    steps:
      - name: "Checkout"
        uses: actions/checkout@v7

      - name: "Install uv"
        uses: astral-sh/setup-uv@v8.3.2
        with:
          version: "0.10.4"
          python-version: "3.13"
          enable-cache: true
          cache-dependency-glob: "uv.lock"

      - name: "Install Python"
        run: uv python install

      - name: "Sync dependencies (CPU only)"
        run: uv sync --frozen --group test

      - name: "Verify Python version"
        run: |
          uv run python --version
          uv run python -c "import sys; assert sys.version_info >= (3, 13), f'Wrong Python: {sys.version}'"

      - name: "Import smoke test"
        run: |
          uv run python -c "
          import sys
          print(f'Python: {sys.version}')
          imports_to_test = [
              ('pytest', 'pytest'),
              ('pydantic', 'pydantic'),
              ('fastapi', 'fastapi'),
          ]
          passed = 0
          failed = 0
          for name, module in imports_to_test:
              try:
                  __import__(module)
                  print(f'✓ {name}')
                  passed += 1
              except ImportError as e:
                  print(f'✗ {name}: {e}')
                  failed += 1
          print(f'Import check: {passed} passed, {failed} failed')
          if failed > 0:
              sys.exit(1)
          "

      - name: "Test collection"
        run: uv run pytest tests/unit/ --collect-only -q

  # =========================================================================
  # TEST - Unit Tests with Coverage
  # =========================================================================
  test:
    name: "Test"
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: [smoke-test]
    env:
      UV_TORCH_BACKEND: "cpu" # Use CPU-only torch to avoid 2GB CUDA download
    steps:
      - name: "Checkout"
        uses: actions/checkout@v7

      - name: "Install uv"
        uses: astral-sh/setup-uv@v8.3.2
        with:
          version: "0.10.4"
          python-version: "3.13"
          enable-cache: true
          cache-dependency-glob: "uv.lock"

      - name: "Install Python"
        run: uv python install

      - name: "Sync dependencies (CPU only)"
        run: uv sync --frozen --group dev --group test

      - name: "Run unit tests"
        run: uv run pytest tests/unit/ tests/security/ tests/api/ -v --tb=short -x

      - name: "Assert no DEBUG in production (Phase 4 gate)"
        run: GRID_ENV=production uv run python scripts/assert_no_debug_in_prod.py

      - name: "Run async function tests"
        run: uv run pytest tests/test_async_boolean.py -v --tb=short || true
        continue-on-error: true

      - name: "Run policy tests"
        run: |
          uv run pytest tests/config/test_devprograms_external_api_access.py tests/config/test_runtime_policy.py tests/test_external_llm_provider.py -v --tb=short || true
        continue-on-error: true

  # =========================================================================
  # INTEGRATION - Integration Tests (main branch or manual)
  # =========================================================================
  integration:
    name: "Integration Tests"
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs: [test]
    if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master' || github.event.inputs.run_slow_tests == 'true'
    continue-on-error: true
    env:
      UV_TORCH_BACKEND: "cpu"
    steps:
      - name: "Checkout"
        uses: actions/checkout@v7

      - name: "Install uv"
        uses: astral-sh/setup-uv@v8.3.2
        with:
          version: "0.10.4"
          python-version: "3.13"
          enable-cache: true
          cache-dependency-glob: "uv.lock"

      - name: "Sync dependencies (CPU only)"
        run: uv sync --frozen --group test

      - name: "Run integration tests"
        run: uv run pytest tests/integration/ -v --tb=short -m "not slow" || true

  # =========================================================================
  # BUILD - Package Building
  # =========================================================================
  build:
    name: "Build Package"
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: [test]
    if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master'
    env:
      UV_TORCH_BACKEND: "cpu"
    steps:
      - name: "Checkout"
        uses: actions/checkout@v7

      - name: "Install uv"
        uses: astral-sh/setup-uv@v8.3.2
        with:
          version: "0.10.4"
          python-version: "3.13"
          enable-cache: true
          cache-dependency-glob: "uv.lock"

      - name: "Sync dependencies"
        run: uv sync --frozen

      - name: "Install build tools"
        run: uv pip install build twine

      - name: "Assert no DEBUG in production build (Phase 4)"
        run: |
          if [ -n "${DEBUG}" ] && [ "${DEBUG}" != "0" ] && [ "${DEBUG}" != "false" ]; then
            echo "::error::DEBUG must not be set for production build (security guardrail)"
            exit 1
          fi
          if [ -n "${ECHOES_API_DEBUG}" ] && [ "${ECHOES_API_DEBUG}" != "0" ] && [ "${ECHOES_API_DEBUG}" != "false" ]; then
            echo "::error::ECHOES_API_DEBUG must not be set for production build (security guardrail)"
            exit 1
          fi
          echo "DEBUG and ECHOES_API_DEBUG not set for build"

      - name: "Build package"
        run: uv run python -m build

      - name: "Verify package"
        run: uv run twine check dist/*

      - name: "Upload build artifacts"
        uses: actions/upload-artifact@v7
        with:
          name: dist-packages
          path: dist/
          retention-days: 7

  # =========================================================================
  # VALIDATION - Schema & Contract Validation (optional)
  # =========================================================================
  validation:
    name: "Schema Validation"
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: [smoke-test]
    if: github.event.inputs.run_validation == 'true'
    continue-on-error: true
    steps:
      - name: "Checkout"
        uses: actions/checkout@v7

      - name: "Install uv"
        uses: astral-sh/setup-uv@v8.3.2
        with:
          version: "0.10.4"
          python-version: "3.13"
          enable-cache: true
          cache-dependency-glob: "uv.lock"

      - name: "Sync dependencies"
        run: uv sync --frozen --group test

      - name: "Validate OpenAPI schemas"
        run: |
          uv run python -c "
          import json
          from pathlib import Path
          schemas = list(Path('schemas').glob('*.json'))
          for s in schemas:
              json.loads(s.read_text())
              print(f'✓ {s.name}')
          "
        continue-on-error: true

      - name: "Validate contracts"
        run: |
          uv run python -c "
          import yaml
          from pathlib import Path
          contracts = list(Path('contracts').glob('*.yaml')) + list(Path('contracts').glob('*.yml'))
          for c in contracts:
              yaml.safe_load(c.read_text())
              print(f'✓ {c.name}')
          "
        continue-on-error: true

  # =========================================================================
  # MCP SECURITY - MCP Server Security Tests
  # =========================================================================
  test-mcp-security:
    name: "MCP Security Tests"
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: [smoke-test]
    env:
      UV_TORCH_BACKEND: "cpu"
    steps:
      - name: "Checkout"
        uses: actions/checkout@v7

      - name: "Install uv"
        uses: astral-sh/setup-uv@v8.3.2
        with:
          version: "0.10.4"
          python-version: "3.13"
          enable-cache: true
          cache-dependency-glob: "uv.lock"

      - name: "Install Python"
        run: uv python install

      - name: "Sync dependencies"
        run: uv sync --frozen --group test

      - name: "Run MCP security tests"
        run: uv run pytest tests/security/test_mcp_server_security.py -v --tb=short

      - name: "Verify no print() in MCP servers"
        run: |
          if grep -rn "^[^#]*print(" mcp-setup/server/*.py; then
            echo "::error::print() found in MCP servers — use logger or sys.stderr instead"
            exit 1
          fi
          echo "✅ No print() calls in MCP servers"

  # =========================================================================
  # CI STATUS - Pipeline Summary
  # =========================================================================
  ci-status:
    name: "CI Status Summary"
    runs-on: ubuntu-latest
    needs: [secrets-scan, lint, smoke-test, test, test-mcp-security]
    if: always()
    timeout-minutes: 5
    steps:
      - name: "Pipeline Status"
        run: |
          echo "## GRID CI Pipeline Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Job | Status |" >> $GITHUB_STEP_SUMMARY
          echo "|-----|--------|" >> $GITHUB_STEP_SUMMARY
          echo "| Secrets Scan | ${{ needs.secrets-scan.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Lint | ${{ needs.lint.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Smoke Test | ${{ needs.smoke-test.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Test | ${{ needs.test.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| MCP Security | ${{ needs.test-mcp-security.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY

          # Only fail on critical jobs (secrets-scan, smoke-test, test)
          if [ "${{ needs.secrets-scan.result }}" != "success" ] || [ "${{ needs.smoke-test.result }}" != "success" ] || [ "${{ needs.test.result }}" != "success" ]; then
            echo "❌ **Pipeline failed** - Critical jobs must pass" >> $GITHUB_STEP_SUMMARY
            exit 1
          else
            echo "✅ **Pipeline passed** - All critical jobs successful" >> $GITHUB_STEP_SUMMARY
          fi
